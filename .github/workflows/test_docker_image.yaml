name: Test Docker image
on:
  pull_request:
    branches: [main*, feat/*, hotfix/*]
  workflow_dispatch:
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-docker-test
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
  security-events: write
jobs:
  test:
    uses: OmniTrustILM/.github/.github/workflows/containers-test.yml@main
    secrets: inherit
    with:
      image: ilm/pyadcs-connector
      cache-scope: pyadcs-connector
      pre-build: none
