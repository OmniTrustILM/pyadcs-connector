name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pyadcs, POSTGRES_PASSWORD: pyadcs, POSTGRES_DB: pyadcs }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_SCHEMA: pyadcs
      DATABASE_NAME: pyadcs
      DATABASE_USER: pyadcs
      DATABASE_PASSWORD: pyadcs
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      LOG_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y gcc python3-dev libkrb5-dev libssl-dev
      - run: |
          python -m pip install --upgrade pip
          pip install -r pyadcs_connector/requirements.txt
      - name: Django checks
        working-directory: ./pyadcs_connector
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: ./pyadcs_connector
        run: python manage.py test PyADCSConnector -v 2
