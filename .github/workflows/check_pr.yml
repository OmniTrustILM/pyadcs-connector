name: "Check PR"
on:
  pull_request:
    branches: [main*]
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-build-pr
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyadcs
          POSTGRES_PASSWORD: pyadcs
          POSTGRES_DB: pyadcs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_SCHEMA: pyadcs
      DATABASE_NAME: pyadcs
      DATABASE_USER: pyadcs
      DATABASE_PASSWORD: pyadcs
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      LOG_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc python3-dev libkrb5-dev libssl-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pyadcs_connector/requirements.txt coverage
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Test with coverage
        run: |
          coverage run pyadcs_connector/manage.py test PyADCSConnector
          coverage xml -o coverage.xml
      - name: Prepare PR context artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n --arg pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" --arg head_repo "$HEAD_REPO" \
             --arg head_branch "$HEAD_BRANCH" --arg base_ref "$BASE_REF" --arg run_id "$RUN_ID" \
             '{pr_number:$pr_number,head_sha:$head_sha,head_repo:$head_repo,head_branch:$head_branch,base_ref:$base_ref,run_id:$run_id}' \
             > pr-context.json
          cat pr-context.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: pr-context, path: pr-context.json, retention-days: 1, if-no-files-found: error }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: coverage-report, path: coverage.xml, if-no-files-found: error }
