name: Sonar Main

# Branch analysis of the default branch. This maintains the SonarCloud
# baseline that the PR analysis chain (check_pr -> dispatch-sonar -> sonar)
# compares against: without a main-branch analysis the project has no
# quality-gate reference and no "new code" definition. Push events on main
# run only repository-owned code, so using SONAR_TOKEN here is safe.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pyadcs, POSTGRES_PASSWORD: pyadcs, POSTGRES_DB: pyadcs }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_SCHEMA: pyadcs
      DATABASE_NAME: pyadcs
      DATABASE_USER: pyadcs
      DATABASE_PASSWORD: pyadcs
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      LOG_LEVEL: DEBUG
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for accurate SCM blame data

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc python3-dev libkrb5-dev libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pyadcs_connector/requirements.txt coverage

      - name: Test with coverage
        run: |
          coverage run pyadcs_connector/manage.py test PyADCSConnector
          coverage xml -o coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=OmniTrustILM_pyadcs-connector
            -Dsonar.organization=ilm
            -Dsonar.qualitygate.wait=true
